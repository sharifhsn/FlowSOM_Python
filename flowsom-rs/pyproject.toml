[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "flowsom-rs"
version = "0.1.0"
description = "Rust-accelerated batch-learning SOM for FlowSOM"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[tool.maturin]
features = ["pyo3/extension-module"]
